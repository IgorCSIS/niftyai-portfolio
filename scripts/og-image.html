<!doctype html>
<!--
  Source for public/images/og-image.png.

  This is a plain 1200x630 HTML page rendered to PNG with headless Chromium
  so the card uses the same fonts and palette as the site instead of
  whatever a server-side SVG rasterizer happens to have installed.

  To regenerate after editing:

    npx playwright screenshot \
      --viewport-size=1200,630 \
      scripts/og-image.html public/images/og-image.png

  1200x630 is the size Slack, LinkedIn, iMessage, and X all crop from
  cleanly. Keep the safe area: nothing important within 60px of an edge.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@600;700&family=Inter:wght@400;500&family=JetBrains+Mono:wght@500&display=block"
    />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }

      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        position: relative;
        background:
          radial-gradient(52rem 34rem at 82% -8rem, rgba(34, 211, 238, 0.22), transparent 66%),
          radial-gradient(40rem 30rem at -6% 100%, rgba(14, 58, 74, 0.85), transparent 70%),
          #0B1220;
        color: #F8FAFC;
        font-family: "Inter", system-ui, sans-serif;
      }

      /* Same masked grid as the site hero. */
      .grid {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(to right, rgba(148, 163, 184, 0.08) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(148, 163, 184, 0.08) 1px, transparent 1px);
        background-size: 72px 72px;
        -webkit-mask-image: radial-gradient(46rem 30rem at 72% 20%, #000 10%, transparent 72%);
      }

      .inner {
        position: relative;
        height: 100%;
        padding: 72px 76px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 14px;
        font-family: "Inter Tight", sans-serif;
        font-weight: 600;
        font-size: 26px;
        letter-spacing: -0.02em;
      }

      .studio {
        margin-left: 4px;
        padding-left: 16px;
        border-left: 1px solid #1E2E49;
        font-family: "JetBrains Mono", monospace;
        font-size: 13px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: #94A3B8;
      }

      h1 {
        font-family: "Inter Tight", sans-serif;
        font-weight: 600;
        font-size: 82px;
        line-height: 0.98;
        letter-spacing: -0.035em;
        max-width: 960px;
      }

      h1 .accent {
        color: #A5F3FC;
        position: relative;
        display: inline-block;
      }

      h1 .accent::after {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        bottom: -10px;
        height: 5px;
        border-radius: 5px;
        background: linear-gradient(90deg, #22D3EE, #A5F3FC 62%, rgba(165, 243, 252, 0));
      }

      .sub {
        margin-top: 34px;
        font-size: 25px;
        line-height: 1.45;
        color: #CBD5E1;
        max-width: 820px;
      }

      .meta {
        display: flex;
        align-items: center;
        gap: 14px;
        font-family: "JetBrains Mono", monospace;
        font-size: 14px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: #94A3B8;
      }

      .dot { width: 5px; height: 5px; border-radius: 999px; background: #22D3EE; }

      .pill {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 12px 22px;
        border-radius: 999px;
        background: #22D3EE;
        color: #0B1220;
        font-family: "Inter Tight", sans-serif;
        font-weight: 600;
        font-size: 19px;
        letter-spacing: -0.01em;
      }

      .foot {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
    </style>
  </head>
  <body>
    <div class="grid"></div>
    <div class="inner">
      <div class="brand">
        <svg width="28" height="28" viewBox="0 0 20 20" fill="none">
          <circle cx="4.5" cy="4.5" r="2.5" fill="#22D3EE" />
          <circle cx="15.5" cy="15.5" r="2.5" fill="#22D3EE" opacity="0.5" />
          <path d="M4.5 7v5.5A3 3 0 0 0 7.5 15.5H13" stroke="#22D3EE" stroke-width="1.5" stroke-linecap="round" />
        </svg>
        Igor Lima
        <span class="studio">NiftyAi</span>
      </div>

      <div>
        <h1>Stop paying people to <span class="accent">copy and paste.</span></h1>
        <p class="sub">
          Python automation for businesses in El Cajon and San Diego. I find the
          repetitive work eating your week and build software that does it instead.
        </p>
      </div>

      <div class="foot">
        <div class="meta">
          <span class="dot"></span> El Cajon / San Diego
          <span class="dot"></span> Python automation
          <span class="dot"></span> Fixed quotes
        </div>
        <span class="pill">$500 automation audit</span>
      </div>
    </div>
  </body>
</html>
